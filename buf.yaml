version: v2
modules:
  - path: .proto
lint:
  use:
    - BASIC
    - FILE_LOWER_SNAKE_CASE
  except:
    - ENUM_FIRST_VALUE_ZERO
    - ENUM_NO_ALLOW_ALIAS
    - FIELD_NOT_REQUIRED
    - IMPORT_NO_PUBLIC
    - IMPORT_USED
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_NO_IMPORT_CYCLE
    - PACKAGE_SAME_DIRECTORY
    - SYNTAX_SPECIFIED
  disallow_comment_ignores: true
breaking:
  use:
    - FIELD_SAME_CARDINALITY
    - FIELD_SAME_TYPE
    - WIRE_JSON
  except:
    - FIELD_SAME_DEFAULT
    - FIELD_WIRE_JSON_COMPATIBLE_TYPE
    - FILE_SAME_PACKAGE
